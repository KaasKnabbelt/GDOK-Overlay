plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = "${rootProject.mod_version}+mc${project.minecraft_version}"
group = rootProject.maven_group
base.archivesName = "${rootProject.archives_base_name}"

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Common module
    implementation project(':common')
    include project(':common')

    // Java-WebSocket (bundled via common, but needs to be included in jar)
    include 'org.java-websocket:Java-WebSocket:1.5.6'

    // Mod Menu integration (optional at runtime)
    compileOnly("com.terraformersmc:modmenu:20.0.1")
}

// Dev-workflow (zie README "Development"): runClient start een dev-client waarin de
// server-gate open staat (ServerGate.devBypass via FabricLoader.isDevelopmentEnvironment()).
// ideConfigGenerated laat Loom ook een IDE-runconfiguratie maken, zodat je onder de
// debugger kunt draaien en gewijzigde klassen kunt herladen zonder Minecraft te herstarten.
loom {
    runs {
        client {
            configName = "Client 26.x"
            ideConfigGenerated = true
        }
    }
}

// In-game verificatie (zie README "Development"): `gradlew :fabric-26.x:runClientGameTest`
// start een echte client, maakt een vlakke wereld, injecteert overlays en controleert
// screenshots op pixelniveau. Bron: src/gametest/java, eigen mod-id zodat de test-jar nooit
// in de release-jar belandt.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "geocraft-overlay-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = false
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("${rootDir}/LICENSE") {
        rename { "${it}_${rootProject.archives_base_name}" }
    }
}
